<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klasso — Gestion scolaire</title>
    <meta name="description" content="Klasso, le logiciel de gestion scolaire pour les établissements de la maternelle à la terminale." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Restaure le vrai chemin après une redirection depuis 404.html
      // (voir public/404.html pour l'explication du mécanisme).
      (function () {
        var redirect = new URLSearchParams(location.search).get("redirect");
        if (redirect) {
          var url = new URL(location.href);
          url.searchParams.delete("redirect");
          history.replaceState(null, "", "/Klasso/" + redirect + url.search);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
